# Automatic imports for the Vercel deployment (serverless functions stop after 5 minutes,
# and a full import round takes longer). Runs `npm run import` against the production
# database and bucket every 3 hours. Configure it in Settings → Secrets and variables → Actions → Secrets,
# either as one secret REPOSECRETS holding the KEY=VALUE lines of .env.production.local, or one secret per
# variable: DATABASE_URL, S3_BUCKET, S3_ENDPOINT, S3_REGION, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
# (optional: REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET, PINTEREST_ACCESS_TOKEN). See scripts/ci-env.sh.
name: Importar memes

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Load configuration
        env:
          REPOSECRETS: ${{ secrets.REPOSECRETS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: bash scripts/ci-env.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run import
