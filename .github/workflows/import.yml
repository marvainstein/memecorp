# Automatic imports for the Vercel deployment (serverless functions stop after 5 minutes,
# and a full import round takes longer). Runs `npm run import` against the production
# database and bucket every 3 hours. Configure it in Settings → Secrets and variables → Actions:
# DATABASE_URL, S3_BUCKET, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_REGION ("auto" if omitted; B2 needs its region)
# (optional: REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET, PINTEREST_ACCESS_TOKEN).
name: Importar memes

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STORAGE_DRIVER: s3
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION || 'auto' }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
    steps:
      - name: Check configuration
        id: check
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$S3_BUCKET" ]; then
            echo "Faltan los secrets DATABASE_URL / S3_*; no se importa nada."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.check.outputs.ready == 'true'
      - run: npm run import
        if: steps.check.outputs.ready == 'true'
